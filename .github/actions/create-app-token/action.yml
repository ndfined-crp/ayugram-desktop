---
name: "Create app token"
description: "Mint a short-lived GitHub App installation token for this repository"

inputs:
  client-id:
    description: "GitHub App client ID"
    required: true
  private-key:
    description: "GitHub App private key (full PEM)"
    required: true

outputs:
  token:
    description: "GitHub App installation access token"
    value: "${{ steps.token.outputs.token }}"

runs:
  using: "composite"
  steps:
    - name: "Create token"
      id: "token"
      uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510" # v3.3.0
      with:
        client-id: "${{ inputs.client-id }}"
        private-key: "${{ inputs.private-key }}"
        permission-contents: "write"
        permission-pull-requests: "write"
