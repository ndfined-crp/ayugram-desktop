---
name: "Cachix: build and cache"
on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.nix"
      - "**/*.lock"
      - "**/*.patch"
  pull_request:

permissions:
  contents: read

jobs:
  cachix:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Setup cachix action"
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ayugram-desktop
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Build package"
        run: nix build
