---
name: "Flake Update Action"
run-name: "nfu"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 0"

jobs:
  locker:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Update Nix flake.lock"
        id: "update"
        uses: "DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3" # v29

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ steps.update.outputs.pull-request-number }} \
            --auto \
            --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
