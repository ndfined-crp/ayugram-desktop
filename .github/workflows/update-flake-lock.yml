---
name: "Flake Update Action"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 0"

jobs:
  locker:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install Nix"
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Update flake.lock"
        uses: "./.github/actions/update-flake-lock"

      - name: "Create app token"
        id: "app-token"
        uses: "./.github/actions/create-app-token"
        with:
          client-id: "${{ secrets.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Create pull request"
        id: "pr"
        uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8.1.1
        with:
          token: "${{ steps.app-token.outputs.token }}"
          branch: "update-flake-lock"
          delete-branch: true
          add-paths: "flake.lock"
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: |
            Automated update of `flake.lock` with `nix flake update`.

      - name: "Enable auto-merge"
        if: "steps.pr.outputs.pull-request-number != ''"
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --auto \
            --squash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
