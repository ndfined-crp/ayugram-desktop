---
name: "Package Update Action"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  updater:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Check for update"
        id: "check"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          latest="$(gh api "repos/AyuGram/AyuGramDesktop/releases/latest" --jq '.tag_name')"
          latest="${latest#v}"
          current="$(awk -F'"' '/^  version = / {print $2; exit}' unwrapped.nix)"

          echo "Current version: $current"
          echo "Latest version: $latest"

          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "current-version=$current" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Install Nix"
        if: steps.check.outputs.update == 'true'
        uses: "cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877" # v32.1.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Update flake.lock"
        if: steps.check.outputs.update == 'true'
        uses: "./.github/actions/update-flake-lock"

      - name: "Update package"
        if: steps.check.outputs.update == 'true'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          latest="${{ steps.check.outputs.version }}"

          hash="$(nix run nixpkgs#nix-prefetch-github -- AyuGram AyuGramDesktop --rev "v${latest}" --fetch-submodules --json | jq -r .hash)"

          sed -i "s|^  version = \".*\";|  version = \"${latest}\";|" unwrapped.nix
          sed -i "s|hash = \".*\";|hash = \"${hash}\";|" unwrapped.nix

          echo "Updated to ${latest}, hash=${hash}"

      - name: "Verify build"
        if: steps.check.outputs.update == 'true'
        run: nix build

      - name: "Read package version"
        if: steps.check.outputs.update == 'true'
        id: "version"
        run: |
          echo "value=$(nix eval --raw .#ayugram-desktop.version)" >> "$GITHUB_OUTPUT"

      - name: "Create app token"
        if: steps.check.outputs.update == 'true'
        id: "app-token"
        uses: "./.github/actions/create-app-token"
        with:
          client-id: "${{ secrets.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Create pull request"
        if: steps.check.outputs.update == 'true'
        id: "pr"
        uses: "peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1" # v8.1.3
        with:
          token: "${{ steps.app-token.outputs.token }}"
          branch: "update-ayugram-desktop"
          delete-branch: true
          add-paths: |
            unwrapped.nix
            flake.lock
          commit-message: "feat: ${{ steps.check.outputs.current-version }}->${{ steps.version.outputs.value }}"
          title: "feat: ${{ steps.check.outputs.current-version }}->${{ steps.version.outputs.value }}"
          body: |
            Automated update of `ayugram-desktop` to [`v${{ steps.version.outputs.value }}`](https://github.com/AyuGram/AyuGramDesktop/releases/tag/v${{ steps.version.outputs.value }}).

            Version and source hash were bumped with `nix-prefetch-github`.

      - name: "Enable auto-merge"
        if: "steps.pr.outputs.pull-request-number != ''"
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --auto \
            --squash
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
